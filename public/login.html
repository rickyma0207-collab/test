<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>用户登录</title>
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <div class="page">
    <div class="shell">
      <section class="hero">
        <div>
          <span class="badge">MySQL 用户系统</span>
          <h1>欢迎回来，<br />请登录您的账户</h1>
          <p>账号信息来自数据库 user_db.users，输入正确的用户名和密码即可进入系统。</p>
        </div>
        <ul>
          <li>安全校验：后端直连 MySQL 验证</li>
          <li>测试账号：mabohao / admin / mbh</li>
          <li>登录成功后自动跳转主页</li>
        </ul>
      </section>

      <section class="card">
        <h2>登录</h2>
        <p class="subtitle">请输入数据库中的用户名和密码</p>

        <form id="loginForm">
          <div class="field">
            <label for="username">用户名</label>
            <input id="username" name="username" type="text" placeholder="例如：mabohao" autocomplete="username" required />
          </div>
          <div class="field">
            <label for="password">密码</label>
            <input id="password" name="password" type="password" placeholder="请输入密码" autocomplete="current-password" required />
          </div>
          <button class="btn" type="submit" id="submitBtn">登 录</button>
        </form>

        <div class="hint">
          <strong>可用测试账号：</strong><br />
          mabohao / 123456<br />
          admin / 666666<br />
          mbh / mbh123
        </div>

        <p class="form-footer">
          还没有账号？<a href="register.html" id="registerLink">立即注册</a>
        </p>
      </section>
    </div>
  </div>

  <div id="toast" class="toast" role="status"></div>

  <script src="js/api.js"></script>
  <script>
    const form = document.getElementById('loginForm')
    const submitBtn = document.getElementById('submitBtn')
    const toast = document.getElementById('toast')

    if (sessionStorage.getItem('user')) {
      location.href = (window.API_BASE || '') + '/dashboard.html'
    }

    function showToast(message, type = 'success') {
      toast.textContent = message
      toast.className = `toast show ${type}`
      clearTimeout(showToast.timer)
      showToast.timer = setTimeout(() => {
        toast.className = 'toast'
      }, 2800)
    }

    checkServer().then((ok) => {
      if (!ok) showServerError(showToast)
    })

    form.addEventListener('submit', async (e) => {
      e.preventDefault()
      const username = document.getElementById('username').value.trim()
      const password = document.getElementById('password').value

      submitBtn.disabled = true
      submitBtn.textContent = '登录中...'

      try {
        const data = await apiPost('/api/login', { username, password })

        if (data.code === 200) {
          sessionStorage.setItem('user', JSON.stringify(data.user))
          showToast('登录成功，正在跳转...', 'success')
          setTimeout(() => {
            location.href = API_BASE + '/dashboard.html'
          }, 600)
        } else {
          showToast(data.msg || '登录失败', 'error')
        }
      } catch {
        showServerError(showToast)
      } finally {
        submitBtn.disabled = false
        submitBtn.textContent = '登 录'
      }
    })
  </script>
</body>
</html>
